<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<!--
  MODELO DE TELA 1080x1350 — Escritório TM / Alfa BPO
  Classes do <body>:  marca  = tm | alfa
                      tipo   = capa | interna
                      fundo  = clara | escura
  Regras: escreva o conteúdo SOMENTE dentro do elemento main.body
  (zona segura, não encosta nas faixas). Se o conteúdo não couber, o
  render.py acusa "ESTOURO" — reduza texto ou tamanho de fonte.
  Capa: acrescente div.deco antes de div.band.
  Alfa BPO: nome "ALFA BPO" (BPO em dourado), slogan "BPO FINANCEIRO",
  rodapé com o @ da Alfa BPO.
  Ícones: SVG em traço (stroke), nunca emoji.
-->
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--w:1080px;--h:1350px}
body.tm{--p:#0D1B36;--p2:#15274B;--a:#D4A017;--a-ink:#8A6A0C;--claro:#F7F7F4;--nota:#F3EEDD;--txt:#0D1B36;--txt2:#46506A;--linha:#D4A017}
body.alfa{--p:#052F4E;--p2:#02253D;--a:#D4A33A;--a-ink:#8A6414;--claro:#F6F8FB;--nota:#E8F5EC;--txt:#052F4E;--txt2:#4A5A6E;--linha:#2DB84B}
*{box-sizing:border-box}
body{margin:0;font-family:'Montserrat',sans-serif}
.slide{width:var(--w);height:var(--h);position:relative;overflow:hidden;background:var(--claro);color:var(--txt)}
.escura .slide{background:var(--p);color:#fff}
/* Faixas */
.band,.band-line{position:absolute;inset:0;pointer-events:none}
.interna.clara .band{background:var(--p);clip-path:polygon(0 0,100% 0,100% 14%,0 20%)}
.interna.escura .band{background:var(--p2);clip-path:polygon(0 0,100% 0,100% 14%,0 20%)}
.interna .band-line{background:var(--linha);clip-path:polygon(0 20%,100% 14%,100% 14.6%,0 20.6%)}
.capa .band{background:var(--p2);clip-path:polygon(0 90%,100% 80%,100% 100%,0 100%)}
.capa .band-line{background:var(--linha);clip-path:polygon(0 89.2%,100% 79.2%,100% 79.8%,0 89.8%)}
.capa .deco{position:absolute;right:-120px;top:-120px;width:520px;height:520px;border:2px solid color-mix(in srgb,var(--a) 22%,transparent);border-radius:50%}
/* Cabeçalho (marca) */
.head{position:absolute;top:88px;left:88px;right:88px;display:flex;justify-content:space-between;align-items:flex-start}
.marca .nome{font-size:36px;font-weight:800;letter-spacing:3px;line-height:1;color:#fff}
.marca .nome b{color:var(--a)}
.marca .slogan{font-size:18px;font-weight:600;letter-spacing:5px;color:rgba(255,255,255,.72);margin-top:8px}
.head .tag{color:var(--a);font-size:24px;font-weight:700;letter-spacing:4px;padding-top:6px}
/* Zona segura */
.body{position:absolute;left:88px;right:88px;top:300px;bottom:170px;overflow:hidden;display:flex;flex-direction:column;gap:32px}
.capa .body{top:220px;bottom:300px;justify-content:center}
/* Rodapé */
.foot{position:absolute;left:88px;right:88px;bottom:88px;display:flex;justify-content:space-between;align-items:center;font-size:26px;font-weight:600;color:var(--txt2)}
.escura .foot,.capa .foot{color:rgba(255,255,255,.8)}
.crc{font-size:18px;font-weight:500;opacity:.62;letter-spacing:.5px}
/* Componentes */
.kicker{color:var(--a-ink);font-size:26px;font-weight:700;letter-spacing:4px;text-transform:uppercase}
.escura .kicker{color:var(--a)}
h1{margin:0;font-size:84px;font-weight:800;line-height:1.05}
h2{margin:0;font-size:62px;font-weight:800;line-height:1.1}
.destaque{color:var(--a)}
.clara .destaque{color:var(--a-ink)}
p.lead{margin:0;font-size:34px;font-weight:500;line-height:1.4;color:var(--txt2)}
.escura p.lead{color:rgba(255,255,255,.88)}
.card{background:#fff;color:var(--txt);border-radius:24px;padding:28px 34px;display:flex;gap:26px;align-items:center}
.clara .card{border:1px solid #E6E1D2}
.card .t{font-size:34px;font-weight:700;line-height:1.25}
.card .s{font-size:27px;font-weight:500;line-height:1.4;color:var(--txt2)}
.num{flex:none;width:92px;height:92px;border-radius:50%;background:var(--p);color:var(--a);font-size:46px;font-weight:800;display:flex;align-items:center;justify-content:center}
.check{flex:none;width:64px;height:64px;border-radius:16px;background:var(--p);display:flex;align-items:center;justify-content:center}
.faixa{background:var(--a);color:var(--p);border-radius:22px;padding:26px 36px;font-size:36px;font-weight:800;line-height:1.2}
.nota{background:var(--nota);color:var(--txt);border-radius:20px;padding:24px 30px;font-size:28px;font-weight:600;line-height:1.3;display:flex;gap:18px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.stack{display:flex;flex-direction:column;gap:18px}
</style>
</head>
<body class="tm interna clara">
<div class="slide">
  <div class="band"></div><div class="band-line"></div>
  <header class="head">
    <div class="marca"><div class="nome">ESCRITÓRIO <b>TM</b></div><div class="slogan">CONTABILIDADE INTELIGENTE</div></div>
    <div class="tag">TAG DA TELA</div>
  </header>
  <main class="body">
    <div class="kicker">Rótulo da seção</div>
    <h2>Título da tela em até duas linhas</h2>
    <div class="stack">
      <div class="card"><div class="num">1</div><div><div class="t">Item principal</div><div class="s">Explicação curta do item</div></div></div>
      <div class="card"><div class="num">2</div><div><div class="t">Item principal</div><div class="s">Explicação curta do item</div></div></div>
    </div>
    <div class="nota">Observação importante em uma linha.</div>
  </main>
  <footer class="foot"><span>@escritoriotm</span><span>2 / 7</span></footer>
</div>
</body>
</html>
